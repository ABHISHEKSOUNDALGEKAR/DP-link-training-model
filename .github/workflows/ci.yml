name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: make

      - name: Directed + random tests
        run: ./dp_lt_model

      - name: Large random regression
        run: ./dp_lt_model --random 2000 --seed 1000

      - name: AddressSanitizer + UBSan
        if: runner.os == 'Linux'
        run: make asan
